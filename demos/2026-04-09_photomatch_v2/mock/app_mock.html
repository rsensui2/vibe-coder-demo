<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photomatch Mock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Poppins', sans-serif; background: #0f0f0f; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .phone { width: 390px; height: 844px; background: white; border: 12px solid #333; border-radius: 50px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); position: relative; }
    
    .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 28px; background: black; border-radius: 0 0 20px 20px; z-index: 10; }
    
    .screen { position: absolute; top: 40px; left: 0; right: 0; bottom: 60px; background: white; overflow-y: auto; display: none; padding: 20px; }
    .screen.active { display: block; }
    
    .header { background: linear-gradient(135deg, #1B4965, #06A77D); color: white; padding: 20px; text-align: center; border-radius: 12px; margin-bottom: 20px; }
    .header h2 { font-size: 18px; font-weight: 700; }
    
    .card { background: #f5f5f5; border-left: 4px solid #F77F00; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .card h3 { font-size: 14px; font-weight: 600; color: #1B4965; margin-bottom: 8px; }
    .card p { font-size: 12px; color: #666; }
    
    .nav { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; }
    
    .nav-item { flex: 1; text-align: center; cursor: pointer; font-size: 11px; color: #999; padding: 8px 0; transition: all 0.2s; border-top: 2px solid transparent; }
    .nav-item.active { color: #F77F00; border-top-color: #F77F00; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    
    <div class="screen active" data-tab="home">
      <div class="header"><h2>🏠 ホーム</h2></div>
      <div class="card">
        <h3>💼 商品撮影案件</h3>
        <p>ファッションEC事業者が撮影依頼</p>
        <p style="color: #F77F00; font-weight: 600; margin-top: 8px;">¥50,000</p>
      </div>
      <div class="card">
        <h3>👥 人物撮影</h3>
        <p>スタートアップ チームフォト</p>
        <p style="color: #F77F00; font-weight: 600; margin-top: 8px;">¥30,000</p>
      </div>
    </div>
    
    <div class="screen" data-tab="search">
      <div class="header"><h2>🔍 検索</h2></div>
      <div style="margin-bottom: 16px;">
        <input type="text" placeholder="カメラマン検索..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px;">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div style="background: linear-gradient(45deg, #1B4965, #F77F00); height: 100px; border-radius: 8px; display: flex; align-items: flex-end; padding: 8px; color: white; font-size: 11px; font-weight: 600;">田中太郎 ⭐4.9</div>
        <div style="background: linear-gradient(45deg, #06A77D, #F77F00); height: 100px; border-radius: 8px; display: flex; align-items: flex-end; padding: 8px; color: white; font-size: 11px; font-weight: 600;">佐藤花子 ⭐4.7</div>
      </div>
    </div>
    
    <div class="screen" data-tab="notif">
      <div class="header"><h2>🔔 通知</h2></div>
      <div class="card">
        <h3>✅ マッチング成立</h3>
        <p>2時間前</p>
      </div>
      <div class="card">
        <h3>⭐ 新しいレビュー</h3>
        <p>評価: 5.0 - 1日前</p>
      </div>
    </div>
    
    <div class="screen" data-tab="profile">
      <div class="header" style="text-align: center; padding: 30px 20px;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.3); margin: 0 auto 12px;"></div>
        <h3 style="font-size: 16px;">田中太郎</h3>
        <p style="font-size: 12px; opacity: 0.9;">プロカメラマン</p>
      </div>
      <div style="padding: 0 20px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; text-align: center; margin-bottom: 20px;">
          <div>
            <div style="font-size: 18px; font-weight: 700; color: #1B4965;">52</div>
            <div style="font-size: 10px; color: #999;">仕事</div>
          </div>
          <div>
            <div style="font-size: 18px; font-weight: 700; color: #F77F00;">¥2.6M</div>
            <div style="font-size: 10px; color: #999;">売上</div>
          </div>
          <div>
            <div style="font-size: 18px; font-weight: 700; color: #06A77D;">4.9</div>
            <div style="font-size: 10px; color: #999;">評価</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="nav">
      <div class="nav-item active" onclick="switchTab('home')">🏠<div>ホーム</div></div>
      <div class="nav-item" onclick="switchTab('search')">🔍<div>検索</div></div>
      <div class="nav-item" onclick="switchTab('notif')">🔔<div>通知</div></div>
      <div class="nav-item" onclick="switchTab('profile')">👤<div>プロフィール</div></div>
    </div>
  </div>
  
  <script>
    function switchTab(t) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelector(`[data-tab="${t}"]`).classList.add('active');
      event.target.closest('.nav-item').classList.add('active');
    }
  </script>
</body>
</html>
